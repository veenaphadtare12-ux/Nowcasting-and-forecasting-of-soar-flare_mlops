# kind cluster for the local demo and the CI job. Host ports 1xxxx do not clash with Docker Compose (8xxx).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: flare
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 18080, listenAddress: "127.0.0.1" }
      - { containerPort: 30000, hostPort: 18000, listenAddress: "127.0.0.1" }
      - { containerPort: 30300, hostPort: 13000, listenAddress: "127.0.0.1" }
      - { containerPort: 30909, hostPort: 19090, listenAddress: "127.0.0.1" }
      - { containerPort: 30420, hostPort: 14200, listenAddress: "127.0.0.1" }
      - { containerPort: 30500, hostPort: 15000, listenAddress: "127.0.0.1" }
