# Single-node clusters (kind, k3s local-path): ReadWriteOnce volumes are shared by pods on the same node.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: predictions
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drift
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
