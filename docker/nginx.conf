# Static React app + reverse proxy to the API. API_UPSTREAM is "api:8000" in Compose and Kubernetes.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # Server-sent events (replay stream): no buffering, long read timeout.
    location ~ ^/api/replay/[^/]+/stream {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Prometheus scrapes the API directly on the internal network; metrics are never served to the public.
    location = /api/metrics { access_log off; return 404; }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Single-page app: unknown paths serve index.html (client-side routing).
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
