name: CD

# Publishes the images to GHCR and deploys them to the Lightsail server (Docker Compose + Caddy) over SSH,
# with automatic rollback.
#   - after CI succeeds on master: images tagged <git sha> and "master"
#   - on a version tag v*.*.*:     images tagged <git sha> and the version (e.g. v1.0.0)
#   - manually (Actions -> CD -> Run workflow)
# The deploy job runs only when the repository secrets DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY exist
# (docs/RUNBOOK.md#continuous-deployment). Without them the images are still published and the job says what is missing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/veenaphadtare12-ux

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Tags (git SHA + version)
        id: tags
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/}; else VERSION=master; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "images: $SHA and $VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          SHA: ${{ steps.tags.outputs.sha }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          FLARE_TAG=$SHA docker compose build api frontend prefect-server
          for img in flare-api flare-frontend flare-prefect-server; do
            docker tag "$REGISTRY/$img:$SHA" "$REGISTRY/$img:$VERSION"
            docker push "$REGISTRY/$img:$SHA"
            docker push "$REGISTRY/$img:$VERSION"
          done

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      TAG: ${{ needs.publish.outputs.sha }}
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          missing=""
          for s in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::notice::Deploy skipped: repository secrets missing:$missing (see docs/RUNBOOK.md#continuous-deployment). Images were published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: SSH setup
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy the Compose bundle to the server
        if: steps.secrets.outputs.ok == 'true'
        run: |
          # Everything the stack needs except the images (pulled from GHCR on the server).
          tar czf /tmp/flare-deploy.tgz docker-compose.yml docker/caddy monitoring model_bundle \
            scripts/seed_registry.py scripts/deploy data/raw_empty
          scp -i ~/.ssh/deploy /tmp/flare-deploy.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/flare-deploy.tgz"
      - name: Deploy with Docker Compose (automatic rollback if the new release is unhealthy)
        if: steps.secrets.outputs.ok == 'true'
        env:
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          FLARE_API_KEYS: ${{ secrets.FLARE_API_KEYS }}
          SMTP_SMARTHOST: ${{ secrets.SMTP_SMARTHOST }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          # Secrets travel on stdin into a root-only .env on the server (never as command-line arguments, never in git).
          {
            echo "set -euo pipefail"
            echo "mkdir -p /opt/flare && tar xzf /tmp/flare-deploy.tgz -C /opt/flare && rm -f /tmp/flare-deploy.tgz"
            echo "umask 077; cat > /opt/flare/.env <<'ENVEOF'"
            for v in SITE_ADDRESS ACME_EMAIL GRAFANA_ADMIN_PASSWORD FLARE_API_KEYS SMTP_SMARTHOST SMTP_FROM SMTP_USERNAME SMTP_PASSWORD ALERT_EMAIL_TO; do
              printf '%s=%s\n' "$v" "${!v}"
            done
            echo "ENVEOF"
            printf 'bash /opt/flare/scripts/deploy/server_deploy.sh %q\n' "$TAG"
          } | ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s
      - name: Smoke test the public URL (roll back on failure)
        if: steps.secrets.outputs.ok == 'true'
        env:
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
        run: |
          URL="http://$DEPLOY_HOST"; [ -n "$SITE_ADDRESS" ] && URL="https://$SITE_ADDRESS"
          echo "public URL: $URL"
          if ! bash scripts/k8s/smoke.sh "$URL"; then
            echo "public smoke test failed: rolling back on the server"
            ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "bash /opt/flare/scripts/deploy/server_deploy.sh --rollback"
            exit 1
          fi
