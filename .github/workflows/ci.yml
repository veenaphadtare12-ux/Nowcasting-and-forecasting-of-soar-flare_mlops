name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      PREFECT_HOME: ${{ github.workspace }}/.prefect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format, new code)
        run: ruff format --check flows src/validation src/ops tests/fixtures tests/test_validation.py tests/test_ops.py

      - name: Pytest (no DVC data needed)
        run: pytest -q -m "not data" -p no:cacheprovider

  # Phase 5: the whole product in Docker Compose, end to end (inbox -> Prefect daily_ingest -> contracts -> features ->
  # champions -> store -> API -> frontend, plus replay, drift, Prometheus, Grafana). Same script as scripts\e2e.ps1.
  compose-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Image tag = git SHA
        run: echo "FLARE_TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - name: End-to-end test (fresh volumes)
        env:
          E2E_FRESH: "1"
        run: bash scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose ps; docker compose logs --tail 200
      - name: Stop
        if: always()
        run: docker compose down --volumes

  # Phase 6: the Kubernetes manifests on a kind cluster: deploy with automatic rollback, smoke test, then a
  # zero-downtime rolling update and the rollback of a bad release.
  kind:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build images (tag = git SHA)
        run: |
          TAG=$(git rev-parse --short=12 HEAD)
          echo "FLARE_TAG=$TAG" >> "$GITHUB_ENV"
          FLARE_TAG=$TAG docker compose build api frontend
      - name: Validate manifests
        run: |
          kubectl kustomize k8s/overlays/kind > /tmp/kind.yaml
          kubectl kustomize k8s/overlays/prod > /tmp/prod.yaml
          grep -c "^kind:" /tmp/kind.yaml /tmp/prod.yaml
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: flare
          config: k8s/kind/cluster.yaml
          wait: 120s
      - name: Deploy (automatic rollback on failure) and smoke test
        run: bash scripts/k8s/kind_up.sh "$FLARE_TAG"
      - name: Rolling update and rollback demo
        run: bash scripts/k8s/rollout_demo.sh http://localhost:18000
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n flare get all,pvc,events --sort-by=.lastTimestamp || true
          kubectl -n flare logs deploy/api --tail 100 || true

  # Phase 7: the infrastructure code is formatted and valid (never applied by CI).
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Lightsail configuration (the one actually deployed)
        working-directory: infra/lightsail
        run: terraform fmt -check && terraform init -backend=false -input=false && terraform validate

  # Security scans: Python dependencies (pip-audit), frontend packages (npm audit), both images (trivy, fail on CRITICAL).
  # Accepted risks are listed with reasons in docs/SECURITY.md and .trivyignore.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (API/worker image dependencies, CI test dependencies)
        run: |
          pip install pip-audit
          pip-audit -r requirements-serve.txt -r requirements-worker.txt --progress-spinner off
          # mlflow 3.16.1 CVEs: accepted (internal-only MLflow server, docs/SECURITY.md); upgrade tracked there
          pip-audit -r requirements-ci.txt --progress-spinner off \
            --ignore-vuln CVE-2026-53995 --ignore-vuln CVE-2026-115886 --ignore-vuln CVE-2026-116691
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (frontend, production and dev dependencies)
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm audit --audit-level=high
      - name: Build images
        run: |
          echo "FLARE_TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          FLARE_TAG=$(git rev-parse --short=12 HEAD) docker compose build api frontend
      - name: Trivy (flare-api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/veenaphadtare12-ux/flare-api:${{ env.FLARE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Trivy (flare-frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/veenaphadtare12-ux/flare-frontend:${{ env.FLARE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Trivy report (HIGH and CRITICAL, informational)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/veenaphadtare12-ux/flare-api:${{ env.FLARE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
