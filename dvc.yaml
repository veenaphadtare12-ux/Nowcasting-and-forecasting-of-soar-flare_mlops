# Run with the venv on PATH:  .venv\Scripts\activate  then  dvc repro
# Detector tuning (python -m src.detection.tune) is deliberately NOT a stage: it reads the tune period only and
# its chosen values are copied into params.yaml by hand (see reports/tuning_best.json).
stages:
  fetch_goes:
    cmd: python -m src.pipeline fetch_goes
    deps:
    - src/goes.py
    - src/pipeline.py
    params:
    - periods
    outs:
    - data/external/goes_events

  solexs_clean:
    cmd: python -m src.pipeline solexs_clean && python -m src.validation.check solexs_minute   # data contract (pandera)
    deps:
    - src/validation/schemas.py
    - src/validation/check.py
    - src/solexs.py
    - src/detection/detector.py
    - src/pipeline.py
    params:
    - paths.data_root_solexs
    - periods
    - solexs
    - flare_detection.min_valid_s_per_min
    outs:
    - data/processed/solexs_clean
    - data/processed/solexs_minute.parquet
    - data/processed/solexs_qc.csv:
        cache: false

  detect_events:
    cmd: python -m src.pipeline detect_events
    deps:
    - src/detection/detector.py
    - src/pipeline.py
    - data/processed/solexs_minute.parquet
    params:
    - flare_detection
    - periods
    outs:
    - data/processed/events_raw.parquet

  legacy_events:
    cmd: python -m src.pipeline legacy_events
    deps:
    - src/detection/legacy.py
    - src/pipeline.py
    - data/processed/solexs_clean
    params:
    - flare_detection_legacy
    - periods
    outs:
    - data/processed/legacy_events_raw.parquet

  match_goes:
    cmd: python -m src.pipeline match_goes && python -m src.validation.check goes_events   # data contract (pandera)
    deps:
    - src/validation/schemas.py
    - src/validation/check.py
    - src/detection/matching.py
    - src/goes.py
    - src/pipeline.py
    - data/processed/events_raw.parquet
    - data/processed/legacy_events_raw.parquet
    - data/external/goes_events
    params:
    - goes_match
    - periods
    outs:
    - data/processed/events.parquet
    - data/processed/events_pairs.parquet
    - data/processed/legacy_events.parquet
    - data/processed/legacy_events_pairs.parquet
    - data/processed/goes_matched.parquet

  evaluate_detector:   # tune + val only; the test period is never evaluated here
    cmd: python -m src.pipeline evaluate_detector
    deps:
    - src/detection/matching.py
    - src/detection/plots.py
    - src/pipeline.py
    - data/processed/solexs_minute.parquet
    - data/processed/events.parquet
    - data/processed/events_pairs.parquet
    - data/processed/legacy_events.parquet
    - data/processed/legacy_events_pairs.parquet
    - data/processed/goes_matched.parquet
    params:
    - evaluation
    - periods
    metrics:
    - reports/detection_metrics.json:
        cache: false
    outs:   # listed file by file so the stage does not own docs/figures/ (docs/figures/eda/ belongs to the EDA notebook)
    - docs/figures/before_after_examples.png:
        cache: false
    - docs/figures/duration_histogram.png:
        cache: false
    - docs/figures/example_1.png:
        cache: false
    - docs/figures/example_2.png:
        cache: false
    - docs/figures/example_3.png:
        cache: false
    - docs/figures/example_4.png:
        cache: false
    - docs/figures/example_5.png:
        cache: false
    - docs/figures/example_6.png:
        cache: false
    - docs/figures/examples.json:
        cache: false

  build_dataset:
    cmd: python -m src.pipeline build_dataset && python -m src.validation.check dataset   # data contract (pandera)
    deps:
    - src/validation/schemas.py
    - src/validation/check.py
    - src/features.py
    - src/labels.py
    - src/dataset.py
    - src/activity.py
    - src/pipeline.py
    - data/processed/solexs_clean
    - data/processed/solexs_minute.parquet
    - data/processed/events.parquet
    - data/processed/events_pairs.parquet
    - data/processed/goes_matched.parquet
    - data/external/goes_events
    - data/processed/hel1os     # optional in code (no HEL1OS -> no hx_* columns); declared so DVC reruns on new sessions
    params:
    - features
    - labels
    - periods
    - flare_detection.end_confirm_min
    - flare_detection.gap_end_min
    outs:
    - data/processed/dataset
    metrics:
    - reports/dataset_summary.json:
        cache: false
    - reports/label_comparison.json:
        cache: false

  train:   # fit on tune (inner time split), select on val; the test file is never opened
    cmd: python -m src.pipeline train
    deps:
    - data/processed/dataset
    - src/dataset.py
    - src/mlflow_utils.py
    - src/models/ablation.py
    - src/models/metrics.py
    - src/models/plots.py
    - src/models/report.py
    - src/models/train.py
    - src/pipeline.py
    params:
    - models
    - periods
    outs:
    - docs/model_figures:
        cache: false
    - models
    - reports/validation_table.md:
        cache: false
    - reports/xgb_cv.csv:
        cache: false
    metrics:
    - reports/model_metrics.json:
        cache: false

  # Optional: HEL1OS is not a dependency of any other stage.
    frozen: true
  hel1os_index:
    cmd: python -m src.pipeline hel1os_index && python -m src.validation.check hel1os   # data contract (pandera)
    deps:
    - src/validation/schemas.py
    - src/validation/check.py
    - src/hel1os.py
    - src/pipeline.py
    params:
    - paths.data_root_hel1os
    outs:
    - data/processed/hel1os

  # ---- improvement experiments (src/improve); tune + val only, the test period is never read
  solexs_spectral:   # E5: 1-min low/high band rates from the SDD2 .pi spectra
    cmd: python -m src.improve.spectral
    deps:
    - src/improve/spectral.py
    - src/solexs.py
    - data/processed/solexs_qc.csv
    params:
    - improve.spectral
    - periods
    outs:
    - data/processed/solexs_spectral_minute.parquet

  goes_xrs_fetch:    # E6: public NOAA GOES-19 XRS 1-min daily files, only up to the last validation day
    cmd: python -m src.improve.goes_xrs fetch
    deps:
    - src/improve/goes_xrs.py
    params:
    - improve.goes_xrs
    - periods
    outs:
    - data/external/goes_xrs

  goes_xrs_minute:
    cmd: python -m src.improve.goes_xrs process
    deps:
    - src/improve/goes_xrs.py
    - data/external/goes_xrs
    outs:
    - data/processed/goes_xrs_minute.parquet

  improve_reference:   # rolling monthly protocol, current features; also derives E1 (adaptive thresholds) and E7 (ensemble)
    cmd: python -m src.improve.run reference
    deps:
    - data/processed/dataset
    - reports/model_metrics.json
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/improve/run.py
    - src/mlflow_utils.py
    - src/models/metrics.py
    - src/models/train.py
    params:
    - improve
    - models
    outs:
    - reports/improve/E1.json:
        cache: false
    - reports/improve/E7.json:
        cache: false
    - reports/improve/reference.json:
        cache: false
    frozen: true
  improve_E2:   # long-context features
    cmd: python -m src.improve.run E2
    deps:
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/solexs_minute.parquet
    - reports/improve/reference.json
    - reports/model_metrics.json
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/improve/run.py
    - src/mlflow_utils.py
    - src/models/metrics.py
    - src/models/train.py
    params:
    - improve
    - models
    outs:
    - reports/improve/E2.json:
        cache: false

    frozen: true
  improve_E3:   # drift-robust features
    cmd: python -m src.improve.run E3
    deps:
    - data/processed/dataset
    - reports/improve/reference.json
    - reports/model_metrics.json
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/improve/run.py
    - src/mlflow_utils.py
    - src/models/metrics.py
    - src/models/train.py
    params:
    - improve
    - models
    outs:
    - reports/improve/E3.json:
        cache: false

    frozen: true
  improve_E4:   # feature pruning
    cmd: python -m src.improve.run E4
    deps:
    - data/processed/dataset
    - reports/improve/reference.json
    - reports/model_metrics.json
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/improve/run.py
    - src/mlflow_utils.py
    - src/models/metrics.py
    - src/models/train.py
    params:
    - improve
    - models
    outs:
    - reports/improve/E4.json:
        cache: false

    frozen: true
  improve_E5:   # SoLEXS spectral features
    cmd: python -m src.improve.run E5
    deps:
    - data/processed/dataset
    - data/processed/solexs_spectral_minute.parquet
    - reports/improve/reference.json
    - reports/model_metrics.json
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/improve/run.py
    - src/mlflow_utils.py
    - src/models/metrics.py
    - src/models/train.py
    params:
    - improve
    - models
    outs:
    - reports/improve/E5.json:
        cache: false

    frozen: true
  improve_E6:   # GOES XRS ablation
    cmd: python -m src.improve.run E6
    deps:
    - data/processed/dataset
    - data/processed/goes_xrs_minute.parquet
    - reports/improve/reference.json
    - reports/model_metrics.json
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/improve/run.py
    - src/mlflow_utils.py
    - src/models/metrics.py
    - src/models/train.py
    params:
    - improve
    - models
    outs:
    - reports/improve/E6.json:
        cache: false

    frozen: true
  improve_final:   # only the KEPT ideas, rolling protocol + the original validation block
    cmd: python -m src.improve.run final
    deps:
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/goes_xrs_minute.parquet
    - data/processed/solexs_minute.parquet
    - data/processed/solexs_spectral_minute.parquet
    - reports/improve/E1.json
    - reports/improve/E2.json
    - reports/improve/E3.json
    - reports/improve/E4.json
    - reports/improve/E5.json
    - reports/improve/E6.json
    - reports/improve/E7.json
    - reports/improve/reference.json
    - reports/model_metrics.json
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/improve/run.py
    - src/mlflow_utils.py
    - src/models/metrics.py
    - src/models/train.py
    params:
    - improve
    - models
    outs:
    - reports/improve/final.json:
        cache: false

  # ---- stage 5 close: frozen final models (docs/FINAL_CHOICE.md) and the ONE-TIME test evaluation
    frozen: true
  final_models:      # fit + thresholds on tune/val only (May 2026 = threshold block); registers alias "champion"
    cmd: python -m src.final.freeze
    deps:
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/goes_xrs_minute.parquet
    - data/processed/solexs_minute.parquet
    - data/processed/solexs_spectral_minute.parquet
    - reports/model_metrics.json
    - src/final/features.py
    - src/final/freeze.py
    - src/improve/features_extra.py
    - src/improve/protocol.py
    - src/mlflow_utils.py
    - src/models/train.py
    params:
    - final
    - improve
    - models
    outs:
    - models_final
    - reports/final/freeze.json:
        cache: false

    frozen: true
  solexs_spectral_test:   # test-day inputs for the one-time scoring only (same code as solexs_spectral)
    cmd: python -m src.final.test_inputs spectral
    deps:
    - data/processed/solexs_qc.csv
    - src/final/test_inputs.py
    - src/improve/spectral.py
    params:
    - improve.spectral
    - periods
    outs:
    - data/processed/final/solexs_spectral_minute_test.parquet

    frozen: true
  goes_xrs_test_fetch:
    cmd: python -m src.final.test_inputs goes_fetch
    deps:
    - src/final/test_inputs.py
    params:
    - improve.goes_xrs
    - periods
    outs:
    - data/external/goes_xrs_test

    frozen: true
  goes_xrs_test_minute:
    cmd: python -m src.final.test_inputs goes_process
    deps:
    - data/external/goes_xrs_test
    - src/final/test_inputs.py
    - src/improve/goes_xrs.py
    outs:
    - data/processed/final/goes_xrs_minute_test.parquet

    frozen: true
  evaluate_test:     # the ONLY stage that reads data/processed/dataset/test.parquet; scores the frozen models once
    cmd: python -m src.final.evaluate_test
    deps:
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/final/goes_xrs_minute_test.parquet
    - data/processed/final/solexs_spectral_minute_test.parquet
    - data/processed/goes_xrs_minute.parquet
    - data/processed/solexs_minute.parquet
    - data/processed/solexs_spectral_minute.parquet
    - models_final
    - src/final/evaluate_test.py
    - src/final/features.py
    - src/final/freeze.py
    - src/improve/features_extra.py
    params:
    - final
    outs:
    - data/processed/final/shap_nowcast_sample.parquet
    - data/processed/final/test_scores.parquet

    - reports/final/test_metrics.json:
        cache: false
    frozen: true
  test_analysis:     # calibration, event-based scores, NOAA M1 lead time, errors, SHAP figure (no test.parquet read)
    cmd: python -m src.final.analysis
    deps:
    - data/processed/events.parquet
    - data/processed/events_pairs.parquet
    - data/processed/final/goes_xrs_minute_test.parquet
    - data/processed/final/shap_nowcast_sample.parquet
    - data/processed/final/test_scores.parquet
    - data/processed/goes_matched.parquet
    - data/processed/solexs_minute.parquet
    - models_final
    - reports/final/test_metrics.json
    - src/final/analysis.py
    params:
    - final
    outs:
    - docs/final_figures:
        cache: false
    - reports/final/analysis.json:
        cache: false
    frozen: true

  # ---- task of 2026-11-13: development protocol 2 (14 months; the old test period is development data now),
  # R1-R4, FINAL_CHOICE_2 and the ONE holdout2 stage. Only evaluate_holdout2 reads holdout2 (tests/test_holdout2_lock.py).
  srs_fetch:
    cmd: python -m src.dev2.context fetch_srs
    deps:
    - src/dev2/context.py
    - src/noaa.py
    outs:
    - data/external/srs

  r3_fetch:
    cmd: python -m src.dev2.pretrain fetch
    deps:
    - src/noaa.py
    params:
    - dev2.r3
    outs:
    - data/external/goes16_xrs
    - data/external/goes_events_hist

  dev2_ref:
    cmd: python -m src.dev2.run ref
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps: &dev2deps
    - src/dev2/run.py
    - src/dev2/protocol.py
    - src/dev2/context.py
    - src/final/features.py
    - src/improve/features_extra.py
    - src/models/train.py
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/solexs_minute.parquet
    - data/processed/solexs_spectral_minute.parquet
    - data/processed/goes_xrs_minute.parquet
    - data/processed/final/solexs_spectral_minute_test.parquet
    - data/processed/final/goes_xrs_minute_test.parquet
    - data/external/goes_events
    - data/external/srs
    - reports/model_metrics.json
    params:
    - dev2
    - models
    outs:
    - reports/dev2/ref.json:
        cache: false

  dev2_e6:
    cmd: python -m src.dev2.run e6
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps: *dev2deps
    params:
    - dev2
    - models
    outs:
    - reports/dev2/e6.json:
        cache: false

  dev2_r2a:
    cmd: python -m src.dev2.run r2a
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps: *dev2deps
    params:
    - dev2
    - models
    outs:
    - reports/dev2/r2a.json:
        cache: false

  dev2_r2b:
    cmd: python -m src.dev2.run r2b
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps: *dev2deps
    params:
    - dev2
    - models
    outs:
    - reports/dev2/r2b.json:
        cache: false

  dev2_champ:
    cmd: python -m src.dev2.run champ
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps: *dev2deps
    params:
    - dev2
    - models
    outs:
    - reports/dev2/champ.json:
        cache: false

  dev2_r1:
    cmd: python -m src.dev2.early run
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps:
    - src/dev2/early.py
    - src/dev2/protocol.py
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/events_pairs.parquet
    - data/processed/goes_matched.parquet
    - data/processed/solexs_minute.parquet
    - data/processed/solexs_spectral_minute.parquet
    - data/processed/goes_xrs_minute.parquet
    - data/processed/final/solexs_spectral_minute_test.parquet
    - data/processed/final/goes_xrs_minute_test.parquet
    params:
    - dev2
    outs:
    - reports/dev2/r1.json:
        cache: false

  dev2_r3_mapping:
    cmd: python -m src.dev2.pretrain mapping
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps:
    - src/dev2/pretrain.py
    - data/processed/events.parquet
    - data/processed/goes_xrs_minute.parquet
    - data/processed/final/goes_xrs_minute_test.parquet
    outs:
    - reports/dev2/r3_mapping.json:
        cache: false

  dev2_r3:
    cmd: python -m src.dev2.pretrain run
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps:
    - src/dev2/pretrain.py
    - src/dev2/run.py
    - src/dev2/protocol.py
    - data/processed/dataset
    - data/processed/solexs_minute.parquet
    - data/external/goes16_xrs
    - data/external/goes_events_hist
    - reports/dev2/r3_mapping.json
    - reports/dev2/ref.json
    params:
    - dev2
    - models
    outs:
    - reports/dev2/r3.json:
        cache: false

  # src/dev2/choose.py (the mechanical choice) writes params.yaml dev2.final.targets/r1 by hand-run, like detector tuning.
  dev2_final:        # FINAL_CHOICE_2 models: fit < 2026-08-01, isotonic on Aug 2026, thresholds on 2026-09-01..12
    cmd: python -m src.dev2.final
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps:
    - src/dev2/final.py
    - src/dev2/run.py
    - src/dev2/early.py
    - src/dev2/protocol.py
    - src/dev2/context.py
    - src/final/features.py
    - src/improve/features_extra.py
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/events_pairs.parquet
    - data/processed/goes_matched.parquet
    - data/processed/solexs_minute.parquet
    - data/processed/solexs_spectral_minute.parquet
    - data/processed/goes_xrs_minute.parquet
    - data/processed/final/solexs_spectral_minute_test.parquet
    - data/processed/final/goes_xrs_minute_test.parquet
    - data/external/goes_events
    - data/external/srs
    - reports/model_metrics.json
    params:
    - dev2
    - models
    outs:
    - models_final2
    - reports/dev2/final_freeze.json:
        cache: false

  evaluate_holdout2:   # the ONLY stage that builds/reads holdout2; refuses to run before FINAL_CHOICE_2.md is committed
    cmd: python -m src.holdout2.evaluate
    frozen: true    # ML phase closed (2026-11-13): never re-run, holdout2 is scored once
    deps:
    - src/holdout2/evaluate.py
    - src/holdout2/ingest.py
    - src/dev2/early.py
    - src/dev2/context.py
    - models_final2
    - docs/FINAL_CHOICE_2.md
    - docs/HOLDOUT2_LOCK.md
    - reports/holdout2/ingest.json
    - reports/holdout2/lock_sha256.txt
    - data/external/holdout2
    - data/processed/dataset
    - data/processed/events.parquet
    - data/processed/solexs_minute.parquet
    params:
    - holdout2
    - dev2.final
    outs:
    - reports/holdout2/metrics.json:
        cache: false
    - reports/holdout2/results.md:
        cache: false
