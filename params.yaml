# All paths and tunable parameters live here. Code must read them via src/config.py,
# never hard-code paths or dates.
paths:
  data_root_solexs: "D:/MLOPS_CP/Data/SoLEXS"
  data_root_hel1os: "D:/MLOPS_CP/Data/HELIOS"
  archive_root: "D:/MLOPS_CP/Data/original_zips"   # original downloads (kept, never modified)
  # HEL1OS extraction: only files the pipeline reads (light curves + aux = 3.9 GB of 28.6 GB). Event lists and
  # spectra stay inside the kept zips and can be extracted later.
  hel1os_extract_include: ["/cdte/lightcurve_", "/czt/lightcurve_", "/aux/"]
  processed_dir: "data/processed"
  mlflow_tracking_uri: "sqlite:///mlflow.db"   # relative path = relative to the project root

# Chronological data periods (inclusive, UTC days). Use these everywhere.
#   tune  : detector thresholds are tuned ONLY here (and models are trained here)
#   val   : model selection / honest detector check; nothing is tuned on it
#   test  : final, untouched. Never used for tuning, never inspected during development.
periods:
  tune: {start: "2025-04-09", end: "2026-01-31"}
  val:  {start: "2026-02-01", end: "2026-05-31"}
  test: {start: "2026-06-01", end: "2026-09-12"}

solexs:
  detector: "SDD2"          # light curves exist only for SDD2
  cadence_s: 1
  min_valid_fraction: 0.5   # a day needs at least this fraction of its seconds inside GTI with data

# --- detector (src/detection/detector.py) -----------------------------------------------------------
# Works on 1-minute mean counts. Background is a trailing quantile and is frozen while an event is active.
flare_detection:
  bg_window_min: 60         # trailing background window (minutes)
  bg_quantile: 0.2
  min_valid_s_per_min: 30   # a minute needs this many valid seconds, else it is NaN
  threshold_sigma: 5        # trigger: minute mean - bg > max(sigma*sqrt(bg/60), frac*bg, abs)
  min_excess_frac: 1.0      # TUNED on tune period only (reports/tuning_best.json, 300-trial grid)
  min_excess_abs: 12.0      # TUNED
  # GOES-style onset: first point of a sustained strictly increasing run of 1-min means
  rise_steps: 3             # TUNED. >= this many consecutive increases (GOES uses 4 minutes = 3 steps)
  min_rise_ratio: 1.4       # last/first minute of the run (GOES: 1.4)
  impulsive_factor: 0       # TUNED. >0: a single-minute jump of this many thresholds also counts as a rise
  max_lookback_min: 30
  # GOES-style end: decay to halfway between peak and pre-flare background, or below threshold
  end_halfway_frac: 0.5
  end_confirm_min: 2
  # merged-event splitting: dip between two peaks, as a fraction of (lower peak - background)
  dip_frac: 0.3             # TUNED
  min_duration_s: 120
  max_duration_s: 10800     # 3 h cap; events hitting the cap are flagged and counted
  gap_end_min: 10           # data gap this long ends an active event

# Legacy detector, kept only to produce "before" numbers/plots (frozen, do not tune).
flare_detection_legacy:
  smooth_window_s: 60
  background_window_s: 3600
  background_quantile: 0.2
  threshold_sigma: 5
  min_excess_frac: 0.5
  min_excess_abs: 5.0
  end_frac: 0.1
  merge_gap_s: 120
  min_duration_s: 120

goes_match:
  tolerance_s: 300          # SoLEXS [onset,end] must overlap GOES [begin-tol, end+tol]

evaluation:
  size_cut_counts_s: 50     # "large detection" cut for precision-vs-GOES (fixed, not tuned)
  long_event_s: 7200
  duration_bins_min: [0, 5, 15, 30, 60, 120, 180]

tuning:
  grid:
    min_excess_frac: [0.3, 0.5, 0.8, 1.0, 1.5]
    min_excess_abs: [3.0, 5.0, 8.0, 12.0, 16.0]
    rise_steps: [2, 3, 4]
    dip_frac: [0.3, 0.5]
    impulsive_factor: [0, 4]
  penalty_long_event: 0.5     # score -= this * (fraction of events > long_event_s)
  penalty_onset_per_min: 0.01 # score -= this * median |onset error| (minutes)

labels:
  horizons_min: [30, 60, 120]
  min_class_c: "C1.0"
  min_class_m: "M1.0"

features:
  cadence_s: 10
  windows_min: [1, 5, 15, 60]   # trailing windows
  min_valid_frac_5m: 0.8        # drop feature rows with less than this fraction of valid data in the last 5 min

# --- models (src/models/train.py). Trained on the tune period only; val is for model selection; test never read.
models:
  targets: [now, c_30m, c_60m, c_120m, m_30m, m_60m, m_120m]
  inner_split: "2025-12-01"   # tune is split in time: fit < split (minus purge); Dec-Jan = threshold selection only
  purge_min: 120              # drop rows whose label window could reach the next block
  train_stride: 6             # use every 6th 10-s row (1 per minute) for fitting: neighbours are near-duplicates
  seeds: [42, 43, 44]         # logistic regression and XGBoost are fitted 3 times; report mean +- std
  rule_feature: ratio_1m_bg   # one-feature baseline: alert when ratio to background exceeds a threshold
  logreg: {C: 1.0, max_iter: 2000}
  xgb: {learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8}   # trees + regularisation come from CV
  cv:                         # rolling-origin CV inside the fit part of the tune period (eval metric: aucpr)
    fold_months: ["2025-08", "2025-09", "2025-10", "2025-11"]   # score month m after training on all earlier months
    stride: 30                # 1 row per 5 min inside CV, to keep 224 fits fast
    n_estimators: [100, 300, 600]
    max_depth: [3, 5]
    min_child_weight: [5, 50]
    reg_lambda: [1, 10]
  operating_points:           # thresholds chosen on Dec-Jan (calibration) only
    A: tss                    # main metric
    B: hss                    # fewer false alarms
  bootstrap: {n: 1000, seed: 0, level: 0.95}   # resample validation DAYS with replacement
  ablation:                   # soft vs hard vs combined, on rows where HEL1OS is available (src/models/ablation.py)
    cal_start: "2025-11-01"   # no HEL1OS session falls in Dec-Jan, so the held-out threshold block is Nov 2025
    cal_end: "2025-11-30"
    train_stride: 1           # HEL1OS rows are few: use every row
    min_positive_episodes: 30 # below this, results are flagged 'too few positives'

# --- improvement experiments (src/improve). Rolling monthly evaluation over tune + val; the test period is never read.
improve:
  months: ["2025-08", "2025-09", "2025-10", "2025-11", "2025-12", "2026-01", "2026-02", "2026-03", "2026-04", "2026-05"]
  # for month m: fit on rows before month m-1 (minus purge), thresholds on month m-1 (minus purge), score month m
  targets: [c_60m, m_60m, now, c_30m, m_30m]   # first two are the primary targets
  purge_min: 120              # gap before each block: no label window may reach the next block
  seed: 42                    # one seed (seed spread was ~0.001 TSS in the main training)
  train_stride: 6
  acceptance: {min_months_improved: 6}         # and the mean monthly TSS must rise
  rolling_days: 30            # E1: thresholds from the previous 30 days, refreshed daily
  far_cap: 0.80               # E1: operating point C = lowest threshold with FAR <= far_cap
  long_windows_h: [3, 6, 12, 24]               # E2
  event_windows_h: [6, 24]                     # E2
  since_event_cap_h: 48                        # E2: time since last event is capped
  drift_days: 7                                # E3: trailing median window
  prune_r: 0.95                                # E4
  spectral:                                    # E5: SoLEXS SDD2 .pi spectra (340 PI channels, 1 s)
    low_channels: [20, 60]                     # dominant quiet-Sun band (no EBOUNDS in the files: chosen by channel)
    high_channels: [80, 160]                   # band that rises 9-24x during an M flare
  goes_xrs:                                    # E6: NOAA GOES-19 XRS L2 1-minute averages, daily files
    base_url: "https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes19/l2/data/xrsf-l2-avg1m_science"
    satellite: g19
    version: v2-2-2
